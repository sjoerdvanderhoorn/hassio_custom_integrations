name: Validate Custom Integrations
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
  tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: custom_components/custom_integrations
      HA_BUILDER_DATA: /tmp/custom-integrations-tests
      HA_CONFIG_DIR: /tmp/custom-integrations-ha
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-test.txt
      - run: python -m pytest tests -q -rs
      - run: playwright install --with-deps chromium
      - run: python tests/browser_marketplace.py
