name: Validate Custom Integrations
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
  tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: custom_components/custom_integrations
      HA_BUILDER_DATA: /tmp/custom-integrations-tests
      HA_CONFIG_DIR: /tmp/custom-integrations-ha
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-test.txt
      - run: python -m pytest tests -q -rs
      - run: playwright install --with-deps chromium
      - run: python tests/browser_marketplace.py

  release:
    if: github.repository == 'sjoerdvanderhoorn/hassio_custom_integrations' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release ')))
    needs: [hassfest, hacs, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Read release version
        id: meta
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re
          from pathlib import Path
          version = json.loads(Path('custom_components/custom_integrations/manifest.json').read_text())['version']
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version)
          print('version=' + version)
          print('tag=v' + version)
          print('asset=hassio_custom_integrations-v' + version + '.zip')
          PY
      - name: Package tracked release source
        env:
          RELEASE_ASSET: ${{ steps.meta.outputs.asset }}
        run: |
          git archive --format=zip --output="$RELEASE_ASSET" HEAD
          sha256sum "$RELEASE_ASSET" > SHA256.txt
      - name: Publish release and assets
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_ASSET: ${{ steps.meta.outputs.asset }}
        with:
          script: |
            const fs = require('fs');
            const repo = context.repo;
            const tag = process.env.RELEASE_TAG;
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({...repo, tag})).data;
              let object = (await github.rest.git.getRef({...repo, ref: 'tags/' + tag})).data.object;
              while (object.type === 'tag') object = (await github.rest.git.getTag({...repo, tag_sha: object.sha})).data.object;
              if (object.sha !== context.sha) throw new Error('This version already belongs to another commit. Increment the version before publishing.');
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                ...repo, tag_name: tag, target_commitish: context.sha,
                name: 'Custom Integrations ' + process.env.RELEASE_VERSION,
                body: fs.readFileSync('CHANGELOG.md', 'utf8'),
                draft: false, prerelease: false
              })).data;
            }
            const existing = new Set((await github.paginate(github.rest.repos.listReleaseAssets, {...repo, release_id: release.id})).map(asset => asset.name));
            for (const name of [process.env.RELEASE_ASSET, 'SHA256.txt']) {
              if (!existing.has(name)) await github.rest.repos.uploadReleaseAsset({
                ...repo, release_id: release.id, name, data: fs.readFileSync(name)
              });
            }
            core.info('Published ' + release.html_url);
