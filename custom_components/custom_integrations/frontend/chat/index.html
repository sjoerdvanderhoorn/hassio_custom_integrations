<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark"><title>Custom Integrations</title><link rel="stylesheet" href="static/style.css"><script src="static/auth.js"></script><script src="static/app.js" defer></script></head>
<body>

<div class="layout">

<main class="main"><header class="chat-header"><strong id="chat-title" data-i18n="newIntegration">New integration</strong><label for="conversation-picker" class="sr-only">Conversations</label><select id="conversation-picker" hidden aria-label="Conversations"><option value="">New conversation</option></select></header>
<div id="chat" class="chat" aria-label="Conversation"><div class="welcome"><h1 data-i18n="welcome">What would you like to build?</h1><p data-i18n="intro">Describe a device, share documentation, or ask for a change to an existing custom integration.</p></div></div>
<div class="composer-area"><div id="pending" aria-live="polite"></div><form id="composer"><label class="sr-only" for="message" data-i18n="message">Describe what you need</label><textarea id="message" rows="1" required placeholder="Describe what you need…"></textarea><button id="send" class="icon-button send-button" type="submit" aria-label="Send message"></button><button id="stop" class="icon-button stop-button" type="button" aria-label="Stop agent" hidden></button></form><p id="connection-error" role="status"></p></div></main>

</div>

<dialog id="logs-dialog" aria-labelledby="logs-title"><header><h2 id="logs-title">Logs</h2><button id="close-logs" class="icon-button" aria-label="Close logs">✕</button></header><p id="logs-description"></p><pre id="raw-logs" tabindex="0"></pre></dialog>
<input id="integration-upload" type="file" accept=".zip,application/zip" hidden>
<div hidden aria-hidden="true"><div id="menu"></div><div id="toggle-panel"></div><div id="new"></div><div id="integrations"></div><div id="ha-status"></div><div id="key-status"></div><div id="show-details"></div><div id="close-integrations"></div><div id="integration-panel"></div><div id="integration-error"></div><div id="integration-details"></div></div></body></html>
